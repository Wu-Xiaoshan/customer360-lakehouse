# Based on tabular-io/docker-spark-iceberg (Apache License 2.0)
# https://github.com/tabular-io/docker-spark-iceberg
# Upstream license retained in ./LICENSE.upstream
#
# Modifications by this project:
#   - removed "build: spark/" from spark-iceberg; the upstream spark/ build
#     context is not vendored here, so we pull the published image instead
#   - repointed notebooks mount to this repository's notebooks/
#   - mounted the project root at /home/iceberg/project
#   - mounted data/ read-only at /home/iceberg/data (source CSV landing zone)
#   - replaced minio/minio and minio/mc, removed from Docker Hub, with pinned
#     quay.io/minio images
#   - pinned tabulario/spark-iceberg to 3.5.5_1.8.1
#   - made the lakehouse survive a restart, which upstream does not intend:
#       * dropped "mc rm -r --force minio/warehouse" from the mc entrypoint,
#         which wiped every table on each startup
#       * named volumes for the MinIO data and for the REST catalog
#       * CATALOG_URI on a SQLite file, since the fixture defaults to
#         jdbc:sqlite::memory: and loses the catalog when the container stops
#   - added a trino service (trinodb/trino:483) with an Iceberg catalog on the
#     REST catalog and MinIO, and file-based access control in ./trino that
#     makes it read-only and hides the crm table in bronze, silver and quarantine
#   - added a superset service, built from apache/superset:6.1.0 with the Trino
#     driver (./superset/Dockerfile), which imports the dashboards in
#     ./superset/dashboards on its first start
# ---------------------------------------------------------------------------
---
services:
  spark-iceberg:
    image: tabulario/spark-iceberg:3.5.5_1.8.1
    container_name: spark-iceberg
    networks:
      iceberg_net:
    depends_on:
      - rest
      - minio
    volumes:
      - ./warehouse:/home/iceberg/warehouse
      - ../notebooks:/home/iceberg/notebooks/notebooks
      - ..:/home/iceberg/project
      - ../data:/home/iceberg/data:ro
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    ports:
      - 8888:8888
      - 8080:8080
      - 10000:10000
      - 10001:10001
  rest:
    image: apache/iceberg-rest-fixture
    container_name: iceberg-rest
    networks:
      iceberg_net:
    ports:
      - 8181:8181
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000
      - CATALOG_URI=jdbc:sqlite:/home/iceberg/catalog.db
    volumes:
      - rest_catalog:/home/iceberg
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
      - MINIO_DOMAIN=minio
    networks:
      iceberg_net:
        aliases:
          - warehouse.minio
    ports:
      - 9001:9001
      - 9000:9000
    volumes:
      - minio_data:/data
    command: ["server", "/data", "--console-address", ":9001"]
  mc:
    depends_on:
      - minio
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: mc
    networks:
      iceberg_net:
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set minio http://minio:9000 admin password) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing minio/warehouse;
      /usr/bin/mc anonymous set public minio/warehouse;
      tail -f /dev/null
      "
  trino:
    image: trinodb/trino:483
    container_name: trino
    networks:
      iceberg_net:
    depends_on:
      - rest
      - minio
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/access-control.properties:/etc/trino/access-control.properties:ro
      - ./trino/rules.json:/etc/trino/rules.json:ro
    ports:
      - 8085:8080
    mem_limit: 2g
  superset:
    build: ./superset
    image: customer360-superset:6.1.0
    container_name: superset
    networks:
      iceberg_net:
    depends_on:
      - trino
    environment:
      - SUPERSET_SECRET_KEY=customer360-demo-secret-key
    volumes:
      - superset_home:/app/superset_home
      - ./superset/dashboards:/app/assets/dashboards
      - ./superset/bootstrap.sh:/app/bootstrap.sh:ro
      - ./superset/assets.sh:/app/assets.sh:ro
    command: ["bash", "/app/bootstrap.sh"]
    ports:
      - 8088:8088
    mem_limit: 1536m
networks:
  iceberg_net:
volumes:
  minio_data:
  rest_catalog:
  superset_home:
