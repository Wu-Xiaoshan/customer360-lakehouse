    meta:
      width: 12
      height: 12
      code: '**Who to contact first.** The risk score adds three signals, 0 to 2 points
        each: time since the last order, refunded or failed orders, and negative-sentiment
        tickets. The total, 0 to 6, maps to four levels, shown with their score range.
        The bottom row compares the risk score with a churn model trained on the same
        history: on held-out customers both are close to chance (AUC 0.5), so the
        levels describe customers rather than predict who will leave.'
