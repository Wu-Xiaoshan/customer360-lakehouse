sql: "SELECT CAST(day_of_week(event_time) AS varchar) || ' ' || format_datetime(event_time,\
  \ 'EEE') AS weekday,\n       hour(event_time) AS hour,\n       count(*) AS events\n\
  FROM silver.clickstream\nWHERE event_time >= TIMESTAMP '2025-09-02 00:00:00 UTC'\n\
  GROUP BY 1, 2"
