sql: "SELECT s.customer_id, s.churn_probability,\n       CASE r.risk_level WHEN 'Very\
  \ Low' THEN '0 Very Low' WHEN 'Low' THEN '1 Low'\n                         WHEN\
  \ 'Medium' THEN '2-3 Medium' WHEN 'High' THEN '4-6 High' END AS risk_band\nFROM\
  \ gold.churn_scores s\nJOIN gold.customer_risk r ON s.customer_id = r.customer_id"
